<!DOCTYPE html>
<html lang="az" data-theme="tabriz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Güney Azərbaycan Təqvimi</title>
<link id="fav" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<div class="wrap">
<header>
  <div class="top"><div class="brand"><span id="logo" aria-hidden="true"></span><p class="app" data-i="app"></p></div><button class="ib" id="setBtn" aria-label="Ayarlar">⚙</button></div>
  <div class="title"><h1 id="mname"></h1><span class="yr" id="myear"></span><span class="ar" id="mar" dir="rtl" lang="az-Arab"></span></div>
  <p class="sub" id="msub"></p>
</header>
<section class="clock" id="clock" data-m="both" aria-label="Saat">
  <svg id="an" viewBox="0 0 100 100" role="img" aria-label="Analoq saat">
    <circle cx="50" cy="50" r="47" fill="var(--card)" stroke="var(--lapis)" stroke-width="3"/>
    <g id="ticks"></g>
    <line id="hh" x1="50" y1="50" x2="50" y2="28" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <line id="mm" x1="50" y1="50" x2="50" y2="16" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
    <line id="ss" x1="50" y1="58" x2="50" y2="12" stroke="var(--pomegranate)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3.2" fill="var(--saffron)"/>
  </svg>
  <div class="dg"><div id="tm"></div><div id="dt"></div></div>
</section>
<div class="nav">
  <button id="prev" aria-label="Əvvəlki ay">‹</button>
  <button id="today" class="grow" data-i="today"></button>
  <button id="next" aria-label="Sonrakı ay">›</button>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="head"></div>
<div class="grid" id="days" style="margin-top:3px"></div>
<section class="detail" id="detail" aria-live="polite"></section>
<footer id="foot"></footer>
</div>
<div id="toasts" role="alert"></div>
<dialog id="dlg" aria-labelledby="dh">
  <h2 id="dh" data-i="set"></h2>
  <h3 data-i="th"></h3><div class="ths" id="ths"></div>
  <h3 data-i="lang"></h3>
  <div class="row"><select id="s-ab" aria-label="Əlifba / الفبا"><option value="ar">عرب الفباسی</option><option value="lat">Latın əlifbası</option></select></div>
  <h3 data-i="clk"></h3>
  <div class="row"><select id="s-clock"><option value="both" data-i="c_both"></option><option value="an" data-i="c_an"></option><option value="dg" data-i="c_dg"></option><option value="off" data-i="c_off"></option></select></div>
  <label class="row"><input type="checkbox" id="s-h24"> <span data-i="h24"></span></label>
  <label class="row"><input type="checkbox" id="s-sec"> <span data-i="sec"></span></label>
  <h3 data-i="cal"></h3>
  <label class="row"><input type="checkbox" id="s-gr"> <span data-i="gr"></span></label>
  <label class="row"><input type="checkbox" id="s-hj"> <span data-i="hj"></span></label>
  <h3 data-i="ntf"></h3>
  <label class="row"><input type="checkbox" id="s-alert"> <span data-i="alr"></span></label>
  <div class="acts"><button class="btn" id="n-ask" data-i="ask"></button><button class="btn" id="n-test" data-i="test"></button></div>
  <p id="nst"></p>
  <div class="acts" style="margin-top:14px"><button class="btn" id="s-reset" data-i="reset"></button><button class="btn" id="s-close" data-i="close" style="margin-inline-start:auto;background:var(--lapis);color:var(--paper);border:0;font-weight:600"></button></div>
</dialog>
<script src="js/app.js"></script>
</body>
</html>
